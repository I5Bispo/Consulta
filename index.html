<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilderan Barbosa - Consultor Oficial Vivo</title>
    <meta name="description" content="Consulte e contrate planos Vivo Fibra, Vivo Total e Vivo Play diretamente pelo WhatsApp.">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0b0118; 
            color: #333333; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. Mapa do Brasil desfocado no fundo */
        .mapa-fundo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(102, 0, 153, 0.4) 0%, rgba(11, 1, 24, 0.95) 80%),
                        url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: blur(10px);
            transform: scale(1.1);
            z-index: 1;
        }

        /* 3. Caixa do Formulário */
        #form-consulta {
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.96); 
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); 
            border-top: 5px solid #660099; 
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Scrollbar customizada para o formulário */
        #form-consulta::-webkit-scrollbar { width: 8px; }
        #form-consulta::-webkit-scrollbar-thumb { background-color: #660099; border-radius: 4px; }

        .logo-container {
            text-align: center;
            margin-bottom: 10px;
            font-size: 38px; 
            font-weight: 900; 
            color: #660099; 
            letter-spacing: -1.5px;
        }

        .consultor-titulo {
            text-align: center;
            color: #555555;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            color: #660099; 
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            color: #555555; 
            font-size: 13px;
        }

        input[type="text"], input[type="email"], input[type="date"], select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            background: #FAFAFA; 
            border: 1px solid #CCCCCC; 
            border-radius: 4px; 
            color: #333333;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #660099; 
            box-shadow: 0 0 5px rgba(102, 0, 153, 0.3);
            background: #FFFFFF;
        }

        .radio-group { 
            margin-top: 10px; 
            margin-bottom: 5px; 
            display: flex;
            gap: 20px;
        }

        .radio-group label { 
            display: inline; 
            font-weight: normal; 
            margin: 0; 
            cursor: pointer; 
            color: #333333;
            font-size: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button { 
            width: 100%; 
            background-color: #99CC33; 
            color: #222222; 
            border: none; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 25px; 
            padding: 15px; 
            font-weight: bold; 
            border-radius: 4px; 
            transition: 0.3s;
        }

        button:hover { background-color: #82B600; }

        .alerta-cnpj {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-left: 4px solid #ffeeba;
            font-size: 13px;
            margin-top: 15px;
            display: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="mapa-fundo"></div>
    <div class="fibras-animadas"></div>

    <form id="form-consulta">
        <div class="consultor-titulo">Ilderan Barbosa - Consultor Oficial VIVO</div>

        <div class="logo-container">
            <span style="color: #99CC33;"></span>
        </div>

        <h2>Solicitação de Plano</h2>
        
        <!-- CPF ou CNPJ -->
        <label>Tipo de Cadastro:</label>
        <div class="radio-group">
            <input type="radio" id="tipo-cpf" name="tipoDoc" value="CPF" checked>
            <label for="tipo-cpf">Pessoa Física</label>
            
            <input type="radio" id="tipo-cnpj" name="tipoDoc" value="CNPJ">
            <label for="tipo-cnpj">Pessoa Jurídica</label>
        </div>

        <!-- Alerta para CNPJ -->
        <div id="alerta-cnpj" class="alerta-cnpj">
            <strong>⚠️ Atenção (CNPJ):</strong> Prepare uma foto FRENTE e VERSO do RG ou CNH do titular para enviar no WhatsApp.
        </div>

        <!-- Adicionado o maxlength 14 por padrão (tamanho do CPF com máscara) -->
        <label for="documento" id="label-documento">🧾 Número do CPF:</label>
        <input type="text" id="documento" required maxlength="14">

        <!-- Campos Específicos CPF -->
        <div id="campos-cpf">
            <label for="nome">👤 Nome Completo:</label>
            <input type="text" id="nome" required>

            <label for="mae">👵🏼 Nome da Mãe:</label>
            <input type="text" id="mae" required>

            <label for="nascimento">🗓 Data de Nascimento:</label>
            <input type="date" id="nascimento" required>
        </div>

        <!-- Campos Específicos CNPJ (Escondido por padrão) -->
        <div id="campos-cnpj" style="display: none;">
            <label for="razao">🏢 Razão Social / Nome da Empresa:</label>
            <input type="text" id="razao">
        </div>

        <!-- Endereço -->
        <div class="grid-2">
            <div>
                <label for="cep">📭 CEP:</label>
                <input type="text" id="cep" required maxlength="9" placeholder="00000-000">
            </div>
            <div>
                <label for="cidade">📍 Cidade:</label>
                <input type="text" id="cidade" required>
            </div>
        </div>

        <div class="grid-2">
            <div style="grid-column: span 2;">
                <label for="rua">🏠 Rua:</label>
                <input type="text" id="rua" required>
            </div>
            <div>
                <label for="numero">🏠 Nº:</label>
                <input type="text" id="numero" required>
            </div>
            <div>
                <label for="complemento">🏠 Complemento:</label>
                <input type="text" id="complemento">
            </div>
        </div>

        <!-- Contatos -->
        <div class="grid-2">
            <div>
                <label for="tel1">📱 Tel 1 (WhatsApp):</label>
                <input type="text" id="tel1" required>
            </div>
            <div>
                <label for="tel2">📱 Tel 2 (Contato):</label>
                <input type="text" id="tel2">
            </div>
        </div>

        <label for="email">📧 Email:</label>
        <input type="email" id="email" required>

        <label for="vencimento">🧾 Data de Vencimento:</label>
        <select id="vencimento" required>
            <option value="">Selecione o dia...</option>
            <option value="1">Dia 1</option>
            <option value="10">Dia 10</option>
            <option value="17">Dia 17</option>
            <option value="21">Dia 21</option>
            <option value="26">Dia 26</option>
        </select>

        <!-- Serviços e Planos -->
        <label for="servico">🛜 Serviço Desejado:</label>
        <select id="servico" required>
            <option value="">Selecione a categoria...</option>
            <option value="Vivo Fibra">Vivo Fibra (Internet Avulsa)</option>
            <option value="Vivo Total" id="opt-vivo-total">Vivo Total (Fibra + Celular)</option>
            <option value="Vivo Play">Vivo Play TV</option>
        </select>

        <div id="caixa-pacote" style="display: none;">
            <label for="pacote">Escolha o Pacote:</label>
            <select id="pacote">
                <!-- Preenchido pelo JavaScript -->
            </select>
        </div>

        <button type="submit">Enviar Cadastro para WhatsApp</button>
    </form>

    <script>
        // TABELA DE PLANOS
        const planosFibraCPF = [
            "600MB - R$ 100,00",
            "700MB - R$ 150,00",
            "1 GIGA - R$ 200,00",
            "2 GIGAS - R$ 400,00"
        ];

        const planosFibraCNPJ = [
            "500MB - R$ 89,99",
            "600MB - R$ 94,99",
            "700MB - R$ 99,99",
            "1 GIGA - R$ 199,99",
            "2 GIGAS - R$ 299,99",
            "10 GIGAS - R$ 2.000,00"
        ];

        const planosVivoTotal = [
            "VIVO TOTAL ESSENCIAL (500MB + 20GB Móvel) - R$ 130,00",
            "VIVO TOTAL ULTRA (700MB + 70GB Móvel) - R$ 170,00",
            "TOTAL ULTRA 2 LINHAS (700MB + 2 Linhas 70GB) - R$ 220,00",
            "FAMILIA 3 (700MB + 3 Linhas 180GB) - R$ 330,00",
            "FAMILIA 4 (700MB + 4 Linhas 240GB) - R$ 380,00"
        ];

        const planosVivoPlay = [
            "VIVO PLAY TV AVANÇADO (2 Pontos - 120 Canais) - R$ 170,00",
            "VIVO PLAY TV COMPLETO (4 Pontos - 140 Canais) - R$ 295,00"
        ];

        // LÓGICA DE ALTERNÂNCIA (CPF / CNPJ)
        const radiosTipoDoc = document.getElementsByName('tipoDoc');
        const labelDoc = document.getElementById('label-documento');
        const camposCPF = document.getElementById('campos-cpf');
        const camposCNPJ = document.getElementById('campos-cnpj');
        const alertaCNPJ = document.getElementById('alerta-cnpj');
        const selectServico = document.getElementById('servico');
        const selectPacote = document.getElementById('pacote');
        const caixaPacote = document.getElementById('caixa-pacote');
        const optVivoTotal = document.getElementById('opt-vivo-total');
        const inputDocumento = document.getElementById('documento');

        function atualizarPacotes() {
            let tipoSelecionado = document.querySelector('input[name="tipoDoc"]:checked').value;
            let servicoSelecionado = selectServico.value;
            let arrayPlanos = [];

            if (servicoSelecionado === 'Vivo Fibra') {
                arrayPlanos = (tipoSelecionado === 'CPF') ? planosFibraCPF : planosFibraCNPJ;
            } else if (servicoSelecionado === 'Vivo Total') {
                arrayPlanos = planosVivoTotal;
            } else if (servicoSelecionado === 'Vivo Play') {
                arrayPlanos = planosVivoPlay;
            }

            if (servicoSelecionado) {
                caixaPacote.style.display = 'block';
                selectPacote.required = true;
                selectPacote.innerHTML = '<option value="">Selecione o plano exato...</option>';
                arrayPlanos.forEach(plano => {
                    let opt = document.createElement('option');
                    opt.value = plano;
                    opt.textContent = plano;
                    selectPacote.appendChild(opt);
                });
            } else {
                caixaPacote.style.display = 'none';
                selectPacote.required = false;
            }
        }

        radiosTipoDoc.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'CPF') {
                    labelDoc.textContent = '🧾 Número do CPF:';
                    camposCPF.style.display = 'block';
                    camposCNPJ.style.display = 'none';
                    alertaCNPJ.style.display = 'none';
                    optVivoTotal.style.display = 'block';
                    inputDocumento.maxLength = 14; // Tamanho do CPF (11 números + pontuação)
                } else {
                    labelDoc.textContent = '🧾 Número do CNPJ:';
                    camposCPF.style.display = 'none';
                    camposCNPJ.style.display = 'block';
                    alertaCNPJ.style.display = 'block';
                    optVivoTotal.style.display = 'none';
                    inputDocumento.maxLength = 18; // Tamanho do CNPJ (14 números + pontuação)
                    
                    if (selectServico.value === 'Vivo Total') {
                        selectServico.value = '';
                        caixaPacote.style.display = 'none';
                    }
                }
                inputDocumento.value = '';
                atualizarPacotes();
            });
        });

        selectServico.addEventListener('change', atualizarPacotes);

        // MÁSCARAS E BUSCA DE CEP
        const inputCep = document.getElementById('cep');
        
        function aplicarMascaraTelefone(v) {
            v = v.replace(/\D/g, ''); 
            v = v.replace(/(\d{2})(\d)/, "($1) $2"); 
            v = v.replace(/(\d)(\d{4})$/, "$1-$2"); 
            return v;
        }

        function aplicarMascaraDoc(v, tipo) {
            v = v.replace(/\D/g, '');
            if (tipo === 'CPF') {
                v = v.substring(0, 11); // Corta em 11 números
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            } else {
                v = v.substring(0, 14); // Corta em 14 números
                v = v.replace(/^(\d{2})(\d)/, '$1.$2');
                v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
                v = v.replace(/(\d{4})(\d)/, '$1-$2');
            }
            return v;
        }

        document.getElementById('tel1').addEventListener('input', e => e.target.value = aplicarMascaraTelefone(e.target.value));
        document.getElementById('tel2').addEventListener('input', e => e.target.value = aplicarMascaraTelefone(e.target.value));
        document.getElementById('documento').addEventListener('input', e => {
            let tipo = document.querySelector('input[name="tipoDoc"]:checked').value;
            e.target.value = aplicarMascaraDoc(e.target.value, tipo);
        });
        
        inputCep.addEventListener('input', e => {
            let v = e.target.value.replace(/\D/g, '');
            e.target.value = v.replace(/^(\d{5})(\d)/, '$1-$2');
        });

        // Auto-completar Endereço via ViaCEP
        inputCep.addEventListener('blur', function() {
            let cep = this.value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(res => res.json())
                .then(data => {
                    if(!data.erro) {
                        document.getElementById('rua').value = data.logradouro;
                        document.getElementById('cidade').value = data.localidade + ' - ' + data.uf;
                        document.getElementById('numero').focus();
                    }
                });
            }
        });

        // ENVIO DO FORMULÁRIO (GERADOR DO TEMPLATE)
        document.getElementById('form-consulta').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const tipo = document.querySelector('input[name="tipoDoc"]:checked').value;
            const doc = document.getElementById('documento').value;
            const cep = document.getElementById('cep').value;
            const cidade = document.getElementById('cidade').value;
            const rua = document.getElementById('rua').value;
            const num = document.getElementById('numero').value;
            const comp = document.getElementById('complemento').value;
            const tel1 = document.getElementById('tel1').value;
            const tel2 = document.getElementById('tel2').value;
            const email = document.getElementById('email').value;
            const venc = document.getElementById('vencimento').value;
            const pacote = selectPacote.value;

            let mensagem = "";

            if (tipo === "CPF") {
                const nome = document.getElementById('nome').value;
                const mae = document.getElementById('mae').value;
                let dataNascBr = document.getElementById('nascimento').value; 
                if (dataNascBr) dataNascBr = dataNascBr.split('-').reverse().join('/');

                mensagem = `🚀 🛜 *TEMPLATE DE CADASTRO VIVO FIBRA CPF*.\n\n` +
                           `👤 *Nome:* ${nome}\n` +
                           `👵🏼 *Nome da Mãe:* ${mae}\n` +
                           `🧾 *CPF:* ${doc}\n` +
                           `🗓 *Data de Nascimento:* ${dataNascBr}\n\n` +
                           `📭 *CEP:* ${cep}\n` +
                           `📍 *Cidade:* ${cidade}\n` +
                           `🏠 *Rua:* ${rua}\n` +
                           `🏠 *Nº:* ${num}\n` +
                           `🏠 *Complemento:* ${comp}\n\n` +
                           `📱 *Tel1:* ${tel1}\n`;
                
                if (tel2 && tel2.trim() !== "") {
                    mensagem += `📱 *Tel2:* ${tel2}\n`;
                }

                mensagem += `\n📧 *Email:* ${email}\n` +
                            `🧾 *Data de vencimento:* ${venc}\n\n` +
                            `🛜 *Pacote escolhido:* ${pacote}`;
            } else {
                // Caso CNPJ
                const razao = document.getElementById('razao').value;

                mensagem = `🚀 🛜 *TEMPLATE DE CADASTRO VIVO FIBRA CNPJ*.\n\n` +
                           `🏢 *Empresa:* ${razao}\n` +
                           `🧾 *CNPJ:* ${doc}\n\n` +
                           `📭 *CEP:* ${cep}\n` +
                           `📍 *Cidade:* ${cidade}\n` +
                           `🏠 *Rua:* ${rua}\n` +
                           `🏠 *Nº:* ${num}\n` +
                           `🏠 *Complemento:* ${comp}\n\n` +
                           `📱 *Tel1:* ${tel1}\n`;

                if (tel2 && tel2.trim() !== "") {
                    mensagem += `📱 *Tel2:* ${tel2}\n`;
                }

                mensagem += `\n📧 *Email:* ${email}\n` +
                            `🧾 *Data de vencimento:* ${venc}\n\n` +
                            `🛜 *Pacote escolhido:* ${pacote}\n\n` +
                            `📸 *ATENÇÃO:* Lembre-se de anexar a foto FRENTE e VERSO do RG ou CNH do representante legal nesta conversa!`;
            }

            const seuNumero = "5511969731382"; 
            const urlWhatsApp = `https://wa.me/${seuNumero}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, '_blank');
        });
    </script>
</body>
</html>
