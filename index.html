<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilderan Barbosa - Consultor Oficial Premium Vivo</title>
    <meta name="description" content="Consulte e contrate planos Vivo Fibra, Vivo Total e Vivo Play diretamente pelo WhatsApp.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mapa-fundo"></div>

    <form id="form-consulta">
        <div class="consultor-titulo">Ilderan Barbosa - Consultor Oficial Premium VIVO</div>

        <div class="logo-container">
            <span style="color: #99CC33;"></span>
        </div>

        <h2>Solicitação de Plano</h2>
        
        <label>Tipo de Cadastro:</label>
        <div class="radio-group">
            <input type="radio" id="tipo-cpf" name="tipoDoc" value="CPF" checked>
            <label for="tipo-cpf">Pessoa Física</label>
            
            <input type="radio" id="tipo-cnpj" name="tipoDoc" value="CNPJ">
            <label for="tipo-cnpj">Pessoa Jurídica</label>
        </div>

        <div id="alerta-cnpj" class="alerta-cnpj">
            <strong>⚠️ Atenção (CNPJ):</strong> Prepare uma foto FRENTE e VERSO do RG ou CNH do titular para enviar no WhatsApp.
        </div>

        <label for="documento" id="label-documento">🧾 Número do CPF:</label>
        <input type="text" id="documento" required maxlength="14">

        <div id="campos-cpf">
            <label for="nome">👤 Nome Completo:</label>
            <input type="text" id="nome" required>

            <label for="mae">👵🏼 Nome da Mãe:</label>
            <input type="text" id="mae" required>

            <label for="nascimento">🗓 Data de Nascimento:</label>
            <input type="date" id="nascimento" required>
        </div>

        <div id="campos-cnpj" style="display: none;">
            <label for="razao">🏢 Razão Social / Nome da Empresa:</label>
            <input type="text" id="razao">
        </div>

        <div class="grid-2">
            <div>
                <label for="cep">📭 CEP:</label>
                <input type="text" id="cep" required maxlength="9" placeholder="00000-000">
            </div>
            <div>
                <label for="cidade">📍 Cidade:</label>
                <input type="text" id="cidade" required>
            </div>
        </div>

        <div class="grid-2">
            <div style="grid-column: span 2;">
                <label for="rua">🏠 Rua:</label>
                <input type="text" id="rua" required>
            </div>
            <div>
                <label for="numero">🏠 Nº:</label>
                <input type="text" id="numero" required>
            </div>
            <div>
                <label for="complemento">🏠 Complemento:</label>
                <input type="text" id="complemento">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label for="tel1">📱 Tel  (WhatsApp):</label>
                <input type="text" id="tel1" required>
            </div>
            <div>
                <label for="tel2">📱 Tel  (Contato):</label>
                <input type="text" id="tel2">
            </div>
        </div>

        <label for="email">📧 Email:</label>
        <input type="email" id="email" required>

        <label for="vencimento">🧾 Data de Vencimento:</label>
        <select id="vencimento" required>
            <option value="">Selecione o dia...</option>
            <option value="1">Dia 1</option>
            <option value="10">Dia 10</option>
            <option value="17">Dia 17</option>
            <option value="21">Dia 21</option>
            <option value="26">Dia 26</option>
        </select>

        <label for="servico">🛜 Serviço Desejado:</label>
        <select id="servico" required>
            <option value="">Selecione a categoria...</option>
            <option value="Vivo Fibra">Vivo Fibra (Internet Avulsa)</option>
            <option value="Vivo Total" id="opt-vivo-total">Vivo Total (Fibra + Celular)</option>
            <option value="Vivo Play">Vivo Play TV</option>
        </select>

        <div id="caixa-pacote" style="display: none;">
            <label for="pacote">Escolha o Pacote:</label>
            <select id="pacote">
            </select>
        </div>

        <button type="submit">Enviar Cadastro para WhatsApp</button>
    </form>

    <script src="js/script.js"></script>
</body>
</html>
